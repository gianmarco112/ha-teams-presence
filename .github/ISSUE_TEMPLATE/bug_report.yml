name: Bug report
description: Report a reproducible problem with Microsoft Teams Presence
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include tenant IDs, client IDs, client secrets, access tokens, email addresses, user IDs or unredacted logs.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core version
      placeholder: 2026.11.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include sanitized logs and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
